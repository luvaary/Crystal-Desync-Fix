<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">End Crystal Logo</title>
  <desc id="desc">A 500 by 500 end crystal style logo with no text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111320"/>
      <stop offset="100%" stop-color="#1e2438"/>
    </linearGradient>
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d3b8ff"/>
      <stop offset="100%" stop-color="#8b63e5"/>
    </linearGradient>
    <linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecdfff"/>
      <stop offset="100%" stop-color="#9c78eb"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c996ff"/>
      <stop offset="100%" stop-color="#6f3cd0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5c84"/>
      <stop offset="100%" stop-color="#b70f39"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="25" y="25" width="450" height="450" rx="30" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <rect x="95" y="58" width="310" height="384" rx="10" fill="#090c16" stroke="#f2f7ff" stroke-width="20"/>

    <polygon points="250,96 356,250 250,404 144,250" fill="#f3eeff"/>
    <polygon points="250,96 250,404 356,250" fill="url(#facetA)" opacity="0.94"/>
    <polygon points="250,96 250,404 144,250" fill="url(#facetB)" opacity="0.9"/>

    <polygon points="250,138 324,250 250,362 176,250" fill="url(#inner)" opacity="0.78"/>
    <polygon points="250,168 300,250 250,332 200,250" fill="#5b2abf" opacity="0.76"/>

    <polygon points="250,212 292,250 250,288 208,250" fill="url(#core)"/>
    <polygon points="250,226 275,250 250,274 225,250" fill="#d10033"/>

    <rect x="231" y="128" width="14" height="30" fill="#fffaff" opacity="0.78"/>
    <rect x="260" y="140" width="10" height="20" fill="#fffaff" opacity="0.6"/>
  </g>
</svg>
